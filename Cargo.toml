[package]
name = "engling"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "eng"
path = "src/main.rs"

[features]
default = []
ui = ["dep:eframe", "dep:egui"]

[dependencies]
clap = { version = "4", features = ["derive"] }
rustyline = "15"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
eframe = { version = "0.29", optional = true }
egui = { version = "0.29", optional = true }

[dev-dependencies]
