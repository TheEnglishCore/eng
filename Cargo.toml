[package]
name = "engling"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "eng"
path = "src/main.rs"

[features]
default = []
ui = ["dep:eframe", "dep:egui"]

[dependencies]
clap = { version = "4", features = ["derive"] }
rustyline = "15"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
eframe = { version = "0.29", optional = true }
egui = { version = "0.29", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# HTTPS-capable synchronous HTTP client. The default `rustls` feature
# pulls in Rustls with the webpki-roots CA bundle — no native-tls /
# OpenSSL dependency, which keeps the build friendly to Termux /
# Android where libssl is awkward to obtain.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
